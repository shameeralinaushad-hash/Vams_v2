{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-eyebrow">{{ company.name }}</div>
        <h1 class="page-title">New quotation</h1>
    </div>
</div>

<form method="post" class="panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label-custom">Client</label>
            <select name="client_id" class="form-select w-100" required>
                {% for client in clients %}
                <option value="{{ client.id }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label-custom">Notes</label>
            <input type="text" name="notes" class="form-control w-100">
        </div>
    </div>

    <h3 style="font-size:1.05rem;margin:20px 0 12px 0;">Line items</h3>
    <table class="data-table mb-3" id="lineItemsTable">
        <thead><tr><th>Description</th><th style="width:90px;">Qty</th><th style="width:130px;">Unit price</th><th style="width:90px;">Tax %</th></tr></thead>
        <tbody>
            <tr>
                <td><input type="text" name="description" class="form-control w-100"></td>
                <td><input type="number" step="0.01" name="qty" class="form-control w-100" value="1"></td>
                <td><input type="number" step="0.01" name="unit_price" class="form-control w-100" value="0"></td>
                <td><input type="number" step="0.01" name="tax_percent" class="form-control w-100" value="0"></td>
            </tr>
        </tbody>
    </table>
    <button type="button" class="btn-outline-brand mb-4" onclick="addRow()">+ Add line</button>
    <br>
    <button type="submit" class="btn-brand">Generate quotation PDF</button>
</form>

<script>
function addRow() {
    const tbody = document.querySelector("#lineItemsTable tbody");
    const row = tbody.rows[0].cloneNode(true);
    row.querySelectorAll("input").forEach(el => el.value = el.name === "qty" ? "1" : (el.name === "description" ? "" : "0"));
    tbody.appendChild(row);
}
</script>
{% endblock %}
