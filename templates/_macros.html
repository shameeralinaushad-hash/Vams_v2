{% macro pdf_actions(pdf_url, size='sm', variant='primary', download_url=None) %}
{% set dl_url = download_url or pdf_url %}
{# Using d-flex w-100 to force block-level display and fill width #}
<div class="d-flex w-100" style="gap: 2px;" role="group">
    <a href="{{ pdf_url }}" target="_blank" class="btn btn-outline-{{ variant }} btn-{{ size }}" style="flex: 1; border-radius: 0.2rem 0 0 0.2rem;">
        <i class="bi bi-eye"></i> View
    </a>
    <button type="button" class="btn btn-outline-{{ variant }} btn-{{ size }}" style="flex: 1; border-radius: 0;" onclick="printPdfUrl('{{ pdf_url }}')">
        <i class="bi bi-printer"></i> Print
    </button>
    <a href="{{ dl_url }}" {% if not download_url %}download{% endif %} class="btn btn-{{ variant if variant == 'primary' else 'outline-' + variant }} btn-{{ size }}" style="flex: 1; border-radius: 0 0.2rem 0.2rem 0; border-top-left-radius:0;border-bottom-left-radius:0;">
        <i class="bi bi-download"></i> Download
    </a>
</div>
{% endmacro %}
