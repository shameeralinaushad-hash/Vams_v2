{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block pagetitle %}New Order{% endblock %}
{% block content %}
<h3>New Order</h3>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">Client</label>
        <select name="client_id" class="form-select" required>
            <option value="" disabled selected>Select client</option>
            {% for c in clients %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Subsidiary (optional)</label>
        <select name="subsidiary_id" id="subsidiarySelect" class="form-select">
            <option value="">— None —</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Title (e.g. "Stationary Products")</label>
        <input type="text" name="title" class="form-control" placeholder="Short description of this order">
    </div>
    <div class="mb-3">
        <label class="form-label">Notes (optional)</label>
        <textarea name="notes" class="form-control" placeholder="What did they inquire about?"></textarea>
    </div>
    <button type="submit" class="btn btn-success" data-key="⏎">Create Order</button>
</form>

<script>
const clientSelect = document.querySelector('select[name="client_id"]');
const subsidiarySelect = document.getElementById("subsidiarySelect");

function loadSubsidiaries(clientId) {
    subsidiarySelect.innerHTML = '<option value="">— None —</option>';
    if (!clientId) return;

    fetch(`/clients/${clientId}/subsidiaries.json`)
        .then(r => r.json())
        .then(subs => {
            subs.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.id;
                opt.textContent = s.name;
                subsidiarySelect.appendChild(opt);
            });
        });
}

if (clientSelect) {
    clientSelect.addEventListener("change", () => loadSubsidiaries(clientSelect.value));
}
</script>
{% endblock %}
