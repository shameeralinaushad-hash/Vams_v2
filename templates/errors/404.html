<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #edf0f4;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            margin: 0;
        }
        .box { text-align: center; }
        .code { font-size: 5rem; font-weight: 700; color: #14181f; margin: 0; font-family: 'IBM Plex Mono', monospace; }
        .msg { color: #75767c; font-size: 1rem; margin-bottom: 1.5rem; }
        a { background: #0e6b6c; color: #fff; padding: 10px 22px; border-radius: 10px; text-decoration: none; font-weight: 600; }
        a:hover { background: #0a5152; }
    </style>
</head>
<body>
    <div class="box">
        <p class="code">404</p>
        <p class="msg">This page doesn't exist, or you don't have access to it.</p>
        <a href="/">Back to Dashboard</a>
    </div>
</body>
</html>
