<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Down for Maintenance</title>
    <meta http-equiv="refresh" content="60">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #edf0f4;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            margin: 0;
        }
        .box { text-align: center; max-width: 420px; padding: 0 20px; }
        .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .title { font-size: 1.5rem; font-weight: 700; color: #14181f; margin: 0 0 0.5rem; }
        .msg { color: #75767c; font-size: 1rem; line-height: 1.5; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🛠️</div>
        <p class="title">We'll be right back</p>
        <p class="msg">
            {{ message or "The system is offline briefly for a quick update. This usually takes just a few minutes — please try again shortly." }}
        </p>
    </div>
</body>
</html>
