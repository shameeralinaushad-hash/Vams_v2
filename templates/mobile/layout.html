<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAMS">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/images/icon-192.png">
<title>{% block title %}VAMS{% endblock %}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #f5f5f7; --card: #fff; --primary: #14181f; --text: #14181f; --muted: #888; --border: #e8e8ed; --success: #1e9e63; --danger: #d64545; --warning: #d99a2b; --radius: 16px; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding-bottom: 72px; overflow-x: hidden; }

/* ---- Header ---- */
.header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 1.1rem; font-weight: 700; }

/* ---- Tab Bar ---- */
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; padding: 6px 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
.tab-item { flex: 1; text-align: center; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 0.65rem; font-weight: 600; transition: color 0.2s; position: relative; -webkit-tap-highlight-color: transparent; }
.tab-item i { display: block; font-size: 1.3rem; margin-bottom: 2px; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
.tab-item:active i { transform: scale(0.85); }
.tab-item.active { color: var(--primary); }
.tab-item.active::after { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; border-radius: 2px; background: var(--primary); animation: tabSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

/* ---- Page transitions ---- */
.page { padding: 16px; animation: pageIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes pageIn { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes tabSlideIn { 0% { width: 0; opacity: 0; } 100% { width: 24px; opacity: 1; } }

/* ---- Card ---- */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.card:active { transform: scale(0.985); }
.card-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }

/* ---- Stat boxes ---- */
.stat-row { display: flex; gap: 10px; }
.stat-box { flex: 1; background: var(--bg); border-radius: 12px; padding: 14px; text-align: center; }
.stat-value { font-size: 1.4rem; font-weight: 800; }
.stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

/* ---- Buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; border: none; cursor: pointer; text-decoration: none; transition: transform 0.15s, opacity 0.15s; -webkit-tap-highlight-color: transparent; }
.btn:active { transform: scale(0.96); opacity: 0.85; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn-sm { padding: 8px 14px; font-size: 0.8rem; }

/* ---- Form ---- */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; background: var(--card); transition: border-color 0.2s; }
.form-group input:focus { border-color: var(--primary); }

/* ---- Alerts / Toast ---- */
.alert { padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 12px; animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.alert-error { background: #fef2f2; color: var(--danger); }
.alert-success { background: #e6f7ef; color: #1e9e63; }
@keyframes slideDown { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }

.toast-container { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 999; pointer-events: none; }
.toast { pointer-events: auto; padding: 14px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); animation: toastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 8px; }
.toast-success { background: var(--success); color: #fff; }
.toast-error { background: var(--danger); color: #fff; }
@keyframes toastIn { 0% { opacity: 0; transform: translateY(-20px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

/* ---- Misc ---- */
.empty { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 0.9rem; }
.bi { display: inline-block; }

/* ---- Shimmer skeleton ---- */
.skeleton { background: linear-gradient(90deg, var(--bg) 25%, #eee 50%, var(--bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* ---- Pull-to-refresh hint ---- */
.pull-hint { text-align: center; font-size: 0.75rem; color: var(--muted); padding: 8px 0; opacity: 0; transition: opacity 0.3s; }

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
    }
}

/* ---- Touch: no hover lift (movement only, keep color) ---- */
@media (hover: none) and (pointer: coarse) {
    *:hover {
        transform: none !important;
    }
}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="header">
    <h1>{% block header %}VAMS{% endblock %}</h1>
    <div style="display:flex;align-items:center;gap:8px;">
        <a href="/?desktop=1" style="font-size:0.7rem;color:var(--muted);text-decoration:none;">Desktop</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('mobile.logout') }}" style="font-size:0.8rem;color:var(--muted);text-decoration:none;">Logout</a>
        {% endif %}
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="page">
<div id="installBanner" style="display:none;background:var(--primary);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:8px;font-size:0.8rem;font-weight:600;animation:slideDown 0.3s cubic-bezier(0.16,1,0.3,1);">
  <span><i class="bi bi-phone"></i> Install VAMS for quick access</span>
  <div style="display:flex;gap:6px;">
    <button onclick="installApp()" style="background:#fff;color:var(--primary);border:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:0.8rem;cursor:pointer;">Install</button>
    <button onclick="dismissInstall()" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:6px 10px;font-size:0.75rem;cursor:pointer;">✕</button>
  </div>
</div>
{% block content %}{% endblock %}
</div>

<div class="tab-bar">
    <a href="{{ url_for('mobile.home') }}" class="tab-item {% if active_tab == 'home' %}active{% endif %}"><i class="bi bi-house-door-fill"></i>Home</a>
    <a href="{{ url_for('mobile.attendance') }}" class="tab-item {% if active_tab == 'attendance' %}active{% endif %}"><i class="bi bi-calendar-check"></i>Attendance</a>
    <a href="{{ url_for('mobile.tasks') }}" class="tab-item {% if active_tab == 'tasks' %}active{% endif %}"><i class="bi bi-check2-square"></i>Tasks</a>
    <a href="{{ url_for('mobile.profile') }}" class="tab-item {% if active_tab == 'profile' %}active{% endif %}"><i class="bi bi-person-circle"></i>Profile</a>
</div>

<script>
function showToast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast toast-' + (type || 'success');
    t.innerHTML = msg;
    c.appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 2500);
}

// ---- PWA Install Prompt ----
var deferredPrompt = null;
var installBanner = document.getElementById('installBanner');
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (installBanner) { installBanner.style.display = 'flex'; }
});
function installApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice) {
        deferredPrompt = null;
        if (installBanner) installBanner.style.display = 'none';
    });
}
function dismissInstall() {
    deferredPrompt = null;
    if (installBanner) installBanner.style.display = 'none';
    localStorage.setItem('installDismissed', '1');
}
window.addEventListener('appinstalled', function() {
    if (installBanner) installBanner.style.display = 'none';
    showToast('✓ Installed successfully!', 'success');
});
// Hide banner if previously dismissed
if (localStorage.getItem('installDismissed') && installBanner) installBanner.style.display = 'none';
</script>

</body>
</html>
