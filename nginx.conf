worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 80;
        server_name vamsbeta.dpdns.org localhost;

        # --- Static files: served directly by nginx ---
        location /static/ {
            alias C:/Users/haide/Videos/business-system_v2/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Service worker (must not be cached)
        location = /sw.js {
            alias C:/Users/haide/Videos/business-system_v2/sw.js;
            add_header Cache-Control "no-cache";
            access_log off;
        }

        # PWA manifest
        location = /manifest.json {
            alias C:/Users/haide/Videos/business-system_v2/static/manifest.json;
            add_header Cache-Control "no-cache";
            access_log off;
        }

        # --- SSE: no buffering, long timeout ---
        location /api/events {
            proxy_pass http://127.0.0.1:8080;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Everything else: proxy to Waitress ---
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
